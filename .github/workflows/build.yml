name: Build

on:
  # Manual only: this repository does not run hosted builds on push or pull request.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Build app bundle
        run: ./Scripts/build-app.sh
